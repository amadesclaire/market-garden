plants:
  # All berries are perennials and use annual_cycle keyed to week-of-year.

- id: strawberry-elsanta
  name: Strawberry
  variety: Elsanta
  category: berry
  family: Rosaceae

  cultivation:
    plants_per_sqm: 4
    established_year_behaviour: runners_year_one

  yield:
    expected_kg_per_sqm: 0.5
    harvest_unit: punnet
    harvest_unit_size_kg: 0.25
    harvest_frequency: weekly

  economics:
    retail_value_per_unit_gbp: 2.50
    box_tiers: [larder, full_yarrow]

  annual_cycle:
  - stage: dormant
    weeks: [1, 10]
    color_hex: "#8B7355"
  - stage: growth
    weeks: [11, 18]
    color_hex: "#90C840"
  - stage: flowering
    weeks: [19, 21]
    color_hex: "#FFB7C5"
    bee_forage_value: medium
  - stage: harvestable
    weeks: [22, 28]
    color_hex: "#E83030"
    description: June-July, pick every 2-3 days
  - stage: post_harvest
    weeks: [29, 44]
    color_hex: "#70A830"
    description: Runner production
  - stage: dormant
    weeks: [45, 52]
    color_hex: "#8B7355"

  bee_forage:
    blossom_weeks: [19, 21]
    value: medium

  visual:
    shape: strawberry
    canopy_radius_cm: 15
    primary_colour_hex: '#70A830'
    fruit_colour_hex: '#E83030'
    support_structure: false
