- id: raspberry-autumn-bliss
  name: Raspberry
  variety: Autumn Bliss
  category: berry
  family: Rosaceae
  description: Reliable autumn fruiting primocane
  propagation: bare_root
  kg_per_tree_at_maturity: 2.0
  harvest_unit: punnet
  harvest_unit_size_kg: 0.150
  harvest_frequency: weekly
  storage_weeks: 1
  water: medium
  sun: full
  frost_tolerant: true
  tree_cost_pence: 450
  retail_value_per_unit_pence: 300
  years_to_first_fruit: 1
  years_to_full_production: 2
  productive_life_years: 10
  annual_cycle:
    - stage: dormant
      week_start: 1
      week_end: 14
      color_hex: "#8B5A2B"
    - stage: leafing
      week_start: 15
      week_end: 22
      color_hex: "#A0D468"
    - stage: blossom
      week_start: 23
      week_end: 26
      color_hex: "#FFFFFF"
      bee_forage_value: high
    - stage: fruiting
      week_start: 27
      week_end: 32
      color_hex: "#E6E6FA"
    - stage: harvest_ready
      week_start: 33
      week_end: 42
      color_hex: "#DA4453"
    - stage: post_harvest
      week_start: 43
      week_end: 46
      color_hex: "#D770AD"
    - stage: dormant
      week_start: 47
      week_end: 52
      color_hex: "#8B5A2B"
  bee_forage:
    blossom_week_start: 23
    blossom_week_end: 26
    value: high
  yield_by_year:
    - year_number: 1
      multiplier: 0.5
    - year_number: 2
      multiplier: 1.0

