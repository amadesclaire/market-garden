trees:
  # ── Fully specified ──────────────────────────────────────────────────────────

  - id: apple-discovery
    name: Apple
    variety: Discovery
    category: fruit_tree
    family: Rosaceae
    rootstock: MM106

    maturity:
      years_to_first_fruit: 3
      years_to_full_production: 6
      productive_life_years: 40

    annual_cycle:
      - stage: dormant
        weeks: [1, 9]
        color_hex: "#8B7355"
        description: Bare branches

      - stage: budding
        weeks: [10, 12]
        color_hex: "#A0855A"
        description: Buds swelling

      - stage: blossom
        weeks: [13, 15]
        color_hex: "#FFB7C5"
        description: Full blossom — peak bee forage
        bee_forage_value: high

      - stage: leafing
        weeks: [15, 20]
        color_hex: "#90C840"
        description: Leaves open, fruitlets forming

      - stage: summer_growth
        weeks: [20, 28]
        color_hex: "#60A820"
        description: Fruit swelling

      - stage: ripening
        weeks: [28, 32]
        color_hex: "#C8D820"
        description: Fruit colouring

      - stage: harvest_ready
        weeks: [32, 35]
        color_hex: "#E84020"
        description: Pick August — does not store

      - stage: post_harvest
        weeks: [35, 44]
        color_hex: "#70A830"
        description: Post-harvest, leaves on

      - stage: leaf_fall
        weeks: [44, 48]
        color_hex: "#C8A030"
        description: Autumn colour

      - stage: dormant
        weeks: [48, 52]
        color_hex: "#8B7355"
        description: Dormant

    yield:
      kg_per_tree_at_maturity: 25
      yield_by_year:
        1: 0.0
        2: 0.0
        3: 0.1
        4: 0.3
        5: 0.6
        6: 1.0
      harvest_unit: weight
      storage_weeks: 0

    bee_forage:
      blossom_weeks: [13, 15]
      value: high

    economics:
      tree_cost_gbp: 18
      annual_input_cost_gbp: 8
      retail_value_per_kg_gbp: 2.50

