  sow_week_start: 14
  sow_week_end: 24
  final_spacing_cm: 25
  plants_per_sqm: 16.0
  rows_per_bed: 2
  direct_sow: true
  support_required: false
  weeks_to_first_harvest: 8
  harvest_window_weeks: 16
  succession_needed: true
  succession_interval_weeks: 4
  expected_kg_per_sqm: 0.5
