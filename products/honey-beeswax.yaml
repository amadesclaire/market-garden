    production:
      source: livestock_hives
      other_inputs:
        - ingredient: cotton_fabric
          amount_g: 150
          cost_per_kg_gbp: 12.00
        - ingredient: pine_resin
          amount_g: 20
          cost_per_kg_gbp: 15.00
