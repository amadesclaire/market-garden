products:
  - id: honey-jar
    name: Yarrow Farm Honey
    category: honey_beeswax
    subcategory: honey
    unit: jar_340g
    retail_price_gbp: 7.50

    production:
      source: livestock_hives
      kg_honey_per_jar: 0.34
      labour_minutes_per_jar: 10
      jar_cost_gbp: 0.55
      lid_cost_gbp: 0.08
      label_cost_gbp: 0.15

    shelf_life_days: 730
